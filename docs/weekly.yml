name: Weekly summary

on:
  schedule:
    # Sunday 07:00 UTC = 09:00 Swedish summer time / 08:00 winter time.
    - cron: "0 7 * * 0"
  workflow_dispatch: {}   # lets you send one manually from the Actions tab

permissions:
  contents: read   # only reads the files the daily run already committed

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install pandas requests

      - name: Send weekly summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/weekly_summary.py
